spring:
  application:
    name: api-gateway

  profiles:
    active: dev

  cloud:
    gateway:

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # AUTH SERVICE
        - id: auth-service
          uri: http://localhost:8001
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/fallback/auth
            - StripPrefix=0

        # USER SERVICE
        - id: user-service
          uri: http://localhost:8002
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/users
            - StripPrefix=0

        # PRODUCT SERVICE
        - id: product-service
          uri: http://localhost:8003
          predicates:
            - Path=/api/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productService
                fallbackUri: forward:/fallback/products
            - StripPrefix=0

        # ORDER SERVICE
        - id: order-service
          uri: http://localhost:8004
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderService
                fallbackUri: forward:/fallback/orders
            - StripPrefix=0

server:
  port: 8080

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 900000

logging:
  level:
    com.bitsandbytes.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      access: unrestricted

eureka:
  client:
    service-url:
      defaultZone: http://localhost:7000/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

